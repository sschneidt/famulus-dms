name: Release

# Ausloeser: ein Versions-Tag, z. B. "v1.2.0" (Ablauf: docs/Updates.md).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  pruefen:
    name: Version pruefen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag, Code, pyproject.toml und CHANGELOG muessen zusammenpassen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' backend/homedms/__init__.py)"
          proj="$(sed -nE 's/^version = "([^"]+)"$/\1/p' backend/pyproject.toml)"
          echo "Tag=$tag  homedms/__init__.py=$code  pyproject.toml=$proj"
          [ "$tag" = "$code" ] && [ "$tag" = "$proj" ] || { echo "::error::Versionen stimmen nicht ueberein"; exit 1; }
          grep -Eq "^## \[$tag\] " CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Abschnitt fuer $tag"; exit 1; }

  tests:
    name: Tests
    needs: pruefen
    uses: ./.github/workflows/ci.yml

  image:
    name: Image bauen und veroeffentlichen
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/famulus-dms
          # v1.2.3 -> 1.2.3, 1.2 und latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          # Nur x86: Ziel sind NAS der Mittelklasse (Anforderungsdokument 2). arm64 bei Bedarf ergaenzen.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub-Release anlegen
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release-Text aus dem CHANGELOG ziehen
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # index() statt Regex: kein Escaping noetig, laeuft in gawk und mawk gleich
          awk -v h="## [$tag]" 'index($0, h) == 1 {on=1; next} index($0, "## [") == 1 {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
