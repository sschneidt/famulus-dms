networks:
  homedms:
    # Internes Docker-Netzwerk. Nur app-api veröffentlicht einen Port zum NAS-Host.
    driver: bridge

volumes:
  pgdata:
  meilidata:
  ollama_models:
  # Zertifizierungsstelle + Server-Zertifikat (privater Schluessel!) - bewusst NICHT im
  # Dokumente-Ordner, der evtl. per Netzwerkfreigabe fuer die Familie sichtbar ist.
  tls:
  # Sprachpakete der Texterkennung (mitgelieferte + auf der Seite "Sprachen" nachinstallierte)
  tessdata:

services:
  # ---------------------------------------------------------------------------
  # Datenbank: PostgreSQL inkl. pg_trgm (Fallback-Volltextsuche). Das pgvector-Image bleibt fuer
  # bestehende Datenbanken, die Erweiterung wird seit Migration 0010 nicht mehr gebraucht.
  # ---------------------------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [homedms]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homedms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?bitte in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-homedms}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Legt pg_trgm + vector-Extension beim allerersten Start automatisch an.
      - ./init/postgres-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homedms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Volltextsuche mit Tippfehler-Toleranz (Anforderungsdokument 4.4).
  # ---------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    networks: [homedms]
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?bitte in .env setzen}
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # Normaler GET-Request (kein "wget --spider", das je nach Variante HEAD sendet).
      # curl ist im offiziellen Meilisearch-Image enthalten, wget -qO- als Rueckfall.
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health || wget -qO- http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Lokale KI (Klassifikation Stufe 2, Metadaten-/Fristen-Extraktion, Chat).
  # Der Server-Prozess läuft dauerhaft, aber sehr leichtgewichtig; das eigentliche
  # Modell wird nur bei Bedarf ins RAM geladen und nach Inaktivität automatisch
  # wieder entladen (Ollama keep_alive) – siehe Anforderungsdokument 4.7.
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    networks: [homedms]
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
    # Kein GPU-Passthrough vorausgesetzt (Synology-Mittelklasse-NAS ohne dedizierte
    # GPU/NPU); bei vorhandener Hardware-Beschleunigung hier ergänzen.

  # ---------------------------------------------------------------------------
  # Einmaliger Init-Job: lädt die konfigurierten Ollama-Modelle beim ersten Start
  # automatisch herunter (Anforderungsdokument 4.7 "Ollama-Modell wird beim ersten
  # Start automatisch im Hintergrund geladen") und beendet sich danach.
  # ---------------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    networks: [homedms]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      # Die ollama-CLI hat keinen --host-Parameter; das Ziel kommt ueber OLLAMA_HOST.
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull "${OLLAMA_CHAT_MODEL:-llama3.2:3b}" &&
        ollama pull "${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}"

  # ---------------------------------------------------------------------------
  # Backend-API (FastAPI). Liefert zusätzlich die gebauten PWA-Frontend-Dateien
  # aus (ein Container weniger als mit separatem nginx-Frontend-Container).
  # ---------------------------------------------------------------------------
  app-api:
    image: ${APP_IMAGE:-homedms/backend}:${APP_VERSION:-latest}
    # Baut lokal aus backend/Dockerfile, falls "image" noch nicht existiert/gepullt werden kann -
    # sobald es eine Registry gibt (Docker-Compose-Entwurf.md Abschnitt 6, offener Punkt), reicht
    # "docker compose pull", ohne diese Zeile entfernen zu muessen.
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    networks: [homedms]
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      APP_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-homedms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homedms}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      JWT_SECRET: ${JWT_SECRET:?bitte in .env setzen}
      # Fester Pfad IM Container (siehe volumes unten) - unabhaengig davon, wohin
      # DOCUMENTS_PATH auf dem Host zeigt.
      DOCUMENTS_PATH: /data/documents
      # Nur zur Anzeige auf der Seite "Scan-Ordner": wo der Ordner auf dem NAS/PC liegt
      SCAN_HOST_PATH: ${SCAN_FOLDER_PATH:-./data/scan}
      TZ: ${TZ:-Europe/Berlin}
      # --- Sicherheit (docs/Sicherheitskonzept.md) ---
      # auto = HTTPS mit eigener Zertifizierungsstelle; off = nur hinter einem Reverse Proxy mit HTTPS
      TLS_MODE: ${TLS_MODE:-auto}
      # Name und IP-Adresse des NAS im Heimnetz - der Container kennt sie nicht selbst
      TLS_HOSTNAMES: ${TLS_HOSTNAMES:-}
      TLS_DIR: /data/tls
      HTTPS_PORT: 8443
      PORT: 8000
      # Einmal-Code fuer die Ersteinrichtung; leer = zufaellig, steht dann im Protokoll
      # (docker compose logs app-api | grep Einrichtungscode)
      SETUP_CODE: ${SETUP_CODE:-}
      # Sprachen der Texterkennung (Standard; dazu kommen die Oberflaechensprachen der Personen)
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
      TESSDATA_DIR: /data/tessdata
    volumes:
      - ${DOCUMENTS_PATH:-./data/documents}:/data/documents
      - tls:/data/tls
      - tessdata:/data/tessdata
    ports:
      # 8443: HomeDMS per HTTPS. 8000: nur Umleitung auf HTTPS + Zertifikat-Hilfe fuer neue Geraete
      # (http://<nas>:8000/zertifikat). Mit TLS_MODE=off (Synology Reverse Proxy macht HTTPS) besser
      # APP_BIND=127.0.0.1 setzen, damit niemand am Proxy vorbei per HTTP zugreift.
      - "${APP_BIND:-0.0.0.0}:${APP_HTTP_PORT:-8000}:8000"
      - "${APP_BIND:-0.0.0.0}:${APP_HTTPS_PORT:-8443}:8443"
    healthcheck:
      # python:3.12-slim enthaelt weder wget noch curl - Python selbst ist aber da.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Hintergrund-Worker: OCR, Klassifikation, Metadaten-/Fristen-Extraktion,
  # Wiedervorlage-Wiederholungen, Benachrichtigungs-Versand. Gleiches Image wie
  # app-api, nur anderer Start-Befehl – kein separates Build/Deployment nötig.
  # Job-Queue läuft direkt über PostgreSQL (Bibliothek "Procrastinate"), daher
  # ist kein zusätzlicher Redis-Container erforderlich (löst den offenen Punkt
  # "Job-Queue-Technologie" aus dem Anforderungsdokument, Abschnitt 7).
  # ---------------------------------------------------------------------------
  app-worker:
    image: ${APP_IMAGE:-homedms/backend}:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    networks: [homedms]
    depends_on:
      db:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      ollama:
        condition: service_started
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-homedms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-homedms}
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      AI_CAUTION_LEVEL: ${AI_CAUTION_LEVEL:-normal}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-deu+eng}
      JWT_SECRET: ${JWT_SECRET}
      DOCUMENTS_PATH: /data/documents
      SCAN_PATH: /data/scan
      TZ: ${TZ:-Europe/Berlin}
      TESSDATA_DIR: /data/tessdata
    volumes:
      - ${DOCUMENTS_PATH:-./data/documents}:/data/documents
      - tessdata:/data/tessdata
      # Scan-Ordner: der Worker holt Dateien ab und verschiebt sie danach nach _importiert/ bzw.
      # _fehler/ - deshalb mit Schreibrecht (nur hier; die API braucht den Ordner nicht).
      - ${SCAN_FOLDER_PATH:-./data/scan}:/data/scan
