[project]
name = "homedms"
version = "0.1.0"
description = "HomeDMS Backend (API + Worker) - siehe /docs im Repo-Root fuer die Architektur-Dokumente"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "passlib[argon2]>=1.7",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "procrastinate>=3.9,<3.10",  # fest wegen kopiertem Schema in alembic/versions/0002 - siehe dort
    "psycopg[binary,pool]>=3.1",  # psycopg[binary] = vorkompiliertes libpq, kein System-libpq-dev noetig
    "pytesseract>=0.3",   # ruft die tesseract-CLI auf - Anforderungsdokument 4.2
    "pillow>=10",
    "pymupdf>=1.24",      # PDF-Textextraktion + Rasterung fuer OCR, keine System-Poppler-Abhaengigkeit
    "pillow-heif>=0.18",  # HEIC-Fotos vom Handy (Anforderungsdokument 4.1)
    "httpx>=0.27",        # Aufrufe an Ollama (homedms/ai/ollama.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "httpx2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homedms"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
