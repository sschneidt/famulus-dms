[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url wird NICHT hier gesetzt, sondern in alembic/env.py aus homedms.config
# gelesen (dieselbe DATABASE_URL wie die Anwendung - eine Quelle der Wahrheit).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
